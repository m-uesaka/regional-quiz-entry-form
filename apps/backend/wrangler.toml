name = "regional-quiz-backend"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Keep the `*.workers.dev` subdomain enabled.
#
# Wrangler decides this as `config.workers_dev ?? routes.length === 0`, and
# `deploy.yml` passes `--route "$FRONTEND_HOST/api/*"` as soon as an
# environment has a `FRONTEND_HOST` variable. With no `workers_dev` key that
# route alone would flip the default to `false`, and the deploy would then
# POST `{enabled: false}` to the Worker's `/subdomain` endpoint, tearing down
# `regional-quiz-backend[-staging].<subdomain>.workers.dev`.
#
# That origin is not spare. It is what the Pages projects' `BACKEND_URL`
# points at (`docs/supabase-deployment.md` 6.3), and SSR rewrites every
# `/api/*` call to it in `handleFetch` (`apps/frontend/src/hooks.server.ts`).
# Losing it breaks every `load` and every form action — and the smoke test at
# the end of the deploy would not notice, because it probes `/api/*` on the
# frontend host, which goes through the new route and answers fine.
#
# Unlike `vars`, `routes`, `unsafe` and `queues` below, `workers_dev` *is* an
# inheritable key, so this one line covers `[env.staging]` and
# `[env.production]` both.
workers_dev = true

# `vars` and `routes` are non-inheritable keys: an `[env.*]` block that doesn't
# restate them gets none at all rather than the top-level ones. So each named
# environment below carries its own copy.
#
# This top-level block is what `wrangler dev` runs — but note it shares `name`
# with `[env.production]`, so a bare `wrangler deploy` or `wrangler secret put`
# in this directory (no `--env`) targets the *production* Worker. The deploy
# workflows always pass `--env`; pass it by hand too.
[vars]
# 非機密の設定値のみここに記載し、機密情報は `wrangler secret put` で登録する
MAIL_FROM_ADDRESS = "entry@entry.regionalquiz.example"
FRONTEND_URL = "https://entry.regionalquiz.example"
# Turnstile の「常に成功する」テスト用シークレット(Cloudflare が公開している
# 固定値)。ローカル開発と E2E はこれで通す。`[env.*.vars]` には**置かない**:
# 同名の var があるとデプロイのたびに `wrangler secret put` で登録した本物の
# シークレットを上書きしてしまい、Turnstile が誰でも素通しになる。実環境の値は
# `docs/supabase-deployment.md` §6.2 の手順でシークレットとして登録する。
#
# そのため `wrangler deploy --env <name>` は毎回
# 「"vars.TURNSTILE_SECRET_KEY" exists at the top level, but not on
# "env.<name>.vars"」と警告する。**これは想定どおりで、警告の言うとおりに
# `[env.*.vars]` へ追記してはいけない**(上記のとおりシークレットが平文で
# 上書きされる)。
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"

# Cloudflare の Rate Limiting bindings (#116).
#
# Wrangler 3 spells these as `unsafe` bindings; the dedicated `[[ratelimits]]`
# table is Wrangler 4 syntax, and this package is deliberately still on 3 (see
# `.github/workflows/deploy.yml`). Rename the tables when it moves.
#
# Like every other binding, `unsafe` is a non-inheritable key: an `[env.*]`
# block that doesn't restate it gets no limiters at all, and a Worker whose
# `env.LOGIN_IP_RATE_LIMITER` is undefined answers 500 on every login. So each
# environment below carries its own copy, with its own `namespace_id` — the
# counters are keyed by that id, and sharing one between environments would
# let a staging load test spend production's budget.
#
# `period` accepts only 10 or 60.
#
# The limits here are the *development* ones, and they are loose on purpose.
# `wrangler dev` sees no `CF-Connecting-IP` header, so every local request
# shares the single `ip:unknown` bucket (`src/middleware/rate-limit.ts`) — the
# production limits would put a developer filling in the entry form twice, or
# an end-to-end run seeding a waitlist, straight into a 429. The real policy
# is in `[env.staging]` / `[env.production]` below.
#
# This is one more thing a bare `wrangler deploy` (no `--env`) would get
# wrong, on top of the `vars` warned about above: it would ship these limits
# to the production Worker. Always pass `--env`.
[[unsafe.bindings]]
name = "LOGIN_IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "3001"
simple = {limit = 1000, period = 60}

[[unsafe.bindings]]
name = "LOGIN_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "3003"
simple = {limit = 1000, period = 60}

[[unsafe.bindings]]
name = "MAIL_TRIGGER_IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "3002"
simple = {limit = 1000, period = 60}

[[unsafe.bindings]]
name = "MAIL_TRIGGER_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "3004"
simple = {limit = 1000, period = 60}

# The bulk mail queue (Task 10-4). `POST /api/staff/tournaments/:id/mail`
# produces one message per recipient and the consumer below sends them
# (`src/lib/bulk-mail-queue.ts`), which is what removed the old 80-recipient
# ceiling: a consumer invocation has its own execution time rather than the
# ~30 seconds of post-response budget a request's `waitUntil()` gets.
#
# **Queues are a paid-plan feature.** `wrangler dev` simulates them locally,
# so development and the end-to-end run need nothing bought, but a deploy to
# an account without Workers Paid fails on these tables. The queues also
# have to exist before the first deploy that names them — see
# `docs/supabase-deployment.md` §6.2.2 for the `wrangler queues create` calls.
#
# Like `vars` and the rate limiters above, `queues` is non-inheritable: an
# `[env.*]` block that doesn't restate it gets no queue at all, and a Worker
# whose `env.BULK_MAIL_QUEUE` is undefined answers 500 on every bulk send.
# Each environment therefore repeats the tables below with **its own queue
# names**: one shared queue would have a staging test's messages consumed by
# the production Worker, which would then really send that mail.
[[queues.producers]]
queue = "regional-quiz-bulk-mail-dev"
binding = "BULK_MAIL_QUEUE"

# 1 message = 1 recipient, so a retry costs one address rather than a whole
# list. The batch is what `src/lib/bulk-mail.ts` then paces against the mail
# provider's rate limit, and `max_concurrency = 1` is what keeps that pacing
# meaningful: the limit is per account, so several consumer invocations
# running at once would each pace themselves and still add up to more than
# the provider allows.
#
# `max_retries` is mirrored by `MAIL_QUEUE_MAX_ATTEMPTS` in
# `src/lib/bulk-mail-queue.ts` (which counts the first delivery too, hence 4
# there and 3 here); change one and change the other, or a recipient the
# consumer hands back on its last attempt is silently dead-lettered instead
# of being counted as failed.
[[queues.consumers]]
queue = "regional-quiz-bulk-mail-dev"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "regional-quiz-bulk-mail-dev-dlq"

# Deployed by `.github/workflows/deploy-staging.yml` on a push to any branch
# other than `main`.
#
# The frontend calls the API at a same-origin `/api/*` (`$lib/api.ts`), and
# nothing in `apps/frontend` proxies that in production — `vite.config.ts`'s
# proxy is `vite dev` only. What routes it is a Workers route: such a route
# wins over the Pages project serving the same hostname, so `/api/*` reaches
# Hono while every other path stays with Pages.
#
# There is deliberately no `routes` key here. Wrangler resolves a route's zone
# against the Cloudflare account at deploy time, so a committed entry naming a
# zone the account doesn't hold fails `wrangler deploy` outright — the whole
# pipeline breaks, not just the routing. The hostname is therefore deployment
# configuration rather than code: `.github/workflows/deploy.yml` passes
# `--route "$FRONTEND_HOST/api/*"` when the environment's `FRONTEND_HOST`
# GitHub variable is set, and deploys with no route when it isn't. Setting up
# a real domain is then a settings change, with nothing to edit here. See
# `docs/supabase-deployment.md` §6.4 and #101.
#
# If you nonetheless add a `routes` key by hand, put it directly under
# `[env.staging]`: below the `[env.staging.vars]` header TOML reads it as a
# var named `routes`, and the deploy then goes out with no route and no
# warning (#100).
[env.staging]
name = "regional-quiz-backend-staging"

# Both hostnames below are still the `regionalquiz.example` placeholder,
# because no real domain has been registered yet (#101).
#
# `FRONTEND_URL` is the less pressing of the two: `deploy.yml` overrides it
# with `--var FRONTEND_URL:"https://$FRONTEND_HOST"` whenever the
# environment's `FRONTEND_HOST` variable is set, so the value here is only
# what a hand-run `wrangler deploy --env staging` would ship. It is deliberate
# that the routed host and the host the mail links point at come from one
# setting — see the comment on that step.
#
# `MAIL_FROM_ADDRESS` has no such override and must be edited here, because
# the sending domain is whichever one is verified with the mail provider and
# need not be the host the site is served from. Until it is a real, verified
# domain, every send fails.
[env.staging.vars]
MAIL_FROM_ADDRESS = "entry@staging.entry.regionalquiz.example"
FRONTEND_URL = "https://staging.entry.regionalquiz.example"

# 10 login attempts a minute from one address. Enough for someone retyping a
# password they half-remember, far too few to work through a
# credential-stuffing list — and this is also the limiter that keeps an
# unauthenticated caller from spending the Worker's CPU on PBKDF2.
[[env.staging.unsafe.bindings]]
name = "LOGIN_IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = {limit = 10, period = 60}

# The per-account limit is on its own limiter *because* its number has to be
# a different one. It exists for the attack the IP limit cannot see — a
# botnet spread thin across addresses, all guessing at one account — but any
# limit keyed on an email address is, by construction, a lever for locking
# the owner of that address out of their own account, and the lower the
# number the cheaper that lever is. At 10/60s an attacker who knows an
# address keeps its owner permanently refused for one request every six
# seconds; 60/60s makes them hold a full request a second to do the same,
# while still capping how far anyone can get through a password list against
# one account. No legitimate sign-in comes anywhere near it.
[[env.staging.unsafe.bindings]]
name = "LOGIN_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2003"
simple = {limit = 60, period = 60}

# The per-address limit is the tight one, and it is the one that matters:
# every call that gets through here sends mail to an address the caller
# chose, so what has to be capped is how much of that one inbox can be
# spent. Three a minute covers a participant who resubmits the entry form
# after a validation error; it does not cover a mail bomb.
[[env.staging.unsafe.bindings]]
name = "MAIL_TRIGGER_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2004"
simple = {limit = 3, period = 60}

# The per-IP limit is looser, because an IP is not one person. Entries open
# at an announced time and are filled in from shared networks — a club or a
# school behind one NAT, several participants behind one carrier's CGNAT —
# and this limit is checked before Turnstile and before validation, so every
# attempt counts against it whether or not it was ever going to send mail.
# At 3/60s the fourth submission from such a network is refused for a reason
# the participant cannot act on. Twenty leaves room for that while still
# capping a single source; the challenge in front of the endpoint, not this
# number, is what a script actually has to get past.
[[env.staging.unsafe.bindings]]
name = "MAIL_TRIGGER_IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = {limit = 20, period = 60}

# The bulk mail queue, on staging's own queue — see the comments on the
# top-level tables.
[[env.staging.queues.producers]]
queue = "regional-quiz-bulk-mail-staging"
binding = "BULK_MAIL_QUEUE"

[[env.staging.queues.consumers]]
queue = "regional-quiz-bulk-mail-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "regional-quiz-bulk-mail-staging-dlq"

# Deployed by `.github/workflows/deploy-production.yml` on a push to `main`.
# `name` is set back to the unsuffixed one: without it, `--env production`
# would deploy a Worker called `regional-quiz-backend-production`.
#
# Like staging, this block carries no `routes` key: the `/api/*` route is
# passed at deploy time from the environment's `FRONTEND_HOST` variable. See
# the comment on `[env.staging]` above for why.
[env.production]
name = "regional-quiz-backend"

# Placeholders, and overridden, exactly as in `[env.staging.vars]` above.
[env.production.vars]
MAIL_FROM_ADDRESS = "entry@entry.regionalquiz.example"
FRONTEND_URL = "https://entry.regionalquiz.example"

# Same policy as staging, on its own namespaces — see the comments there.
[[env.production.unsafe.bindings]]
name = "LOGIN_IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = {limit = 10, period = 60}

[[env.production.unsafe.bindings]]
name = "LOGIN_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = {limit = 60, period = 60}

[[env.production.unsafe.bindings]]
name = "MAIL_TRIGGER_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = {limit = 3, period = 60}

[[env.production.unsafe.bindings]]
name = "MAIL_TRIGGER_IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = {limit = 20, period = 60}

# The bulk mail queue, on production's own queue — see the comments on the
# top-level tables.
[[env.production.queues.producers]]
queue = "regional-quiz-bulk-mail"
binding = "BULK_MAIL_QUEUE"

[[env.production.queues.consumers]]
queue = "regional-quiz-bulk-mail"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "regional-quiz-bulk-mail-dlq"
