name: deploy-staging

# Staging is the development environment and follows `develop`: feature
# branches are merged into `develop`, which deploys here, and `develop` is
# merged into `main` to release (`deploy-production.yml`). Feature branches
# themselves no longer deploy on push, so automatic deploys keep staging on
# what is about to go to production rather than whichever branch was pushed
# last (a manual dispatch, below, is the one exception).
#
# To try an unmerged branch against real Supabase and Cloudflare, start this
# workflow by hand with `workflow_dispatch` on that branch. It overwrites
# staging until the next push to `develop`, and `deploy.yml`'s concurrency
# group queues it behind any deploy already in flight.
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      wrangler-env: staging
      pages-project-name: regional-quiz-frontend-staging
    # The called workflow reads `SUPABASE_*` / `CLOUDFLARE_*` from the
    # `staging` Environment, which resolves against the job it declares
    # `environment:` on. Nothing is passed by name here so that adding a secret
    # to `deploy.yml` doesn't need an edit in both callers.
    secrets: inherit
