name: ci
# `push` is limited to the two long-lived branches (`develop` deploys to
# staging, `main` to production) so a PR branch doesn't run the whole workflow
# twice (once for the push, once for the pull_request) on every commit.
on:
  push:
    branches: [main, develop]
  pull_request:

# Supersede an in-flight run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only on PR branches. Cancelling on `main` or `develop` would leave a merge
  # commit with no completed verdict whenever two PRs land close together.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # `bun --filter '*'` already parallelises across packages, but the three
      # tasks themselves are serial within a job, so run them side by side.
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run ${{ matrix.task }}

  # The backend's `describe.skipIf(!(await isDbReachable()))` suites, which
  # `check (test)` skips for want of a database.
  #
  # A job of its own rather than a step in `e2e`, so that the two cannot meet
  # in one database: each runner has its own stack. As steps in order they
  # would share one, and `apps/e2e/support/seed.ts` starts by emptying a fixed
  # list of tables, which fails on a foreign key if an integration test left a
  # row behind in a table it does not list. It also keeps the two verdicts
  # apart: a failure here does not stop e2e from reporting, or the reverse.
  # The cost is starting a second stack, on a runner that is otherwise idle.
  integration:
    runs-on: ubuntu-latest
    env:
      # An unreachable database fails the run rather than skipping every suite
      # (`apps/backend/src/test-support/db.ts`).
      REQUIRE_SUPABASE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the `e2e` job below, which says why it is pinned.
          version: 2.115.0
      - run: bun install
      - run: bash .github/scripts/start-local-supabase.sh
      # The whole package rather than a list of files, which would quietly
      # miss the next file to gain an integration suite. Run directly rather
      # than through `bun --filter` so the output is bun's own, with the `skip`
      # count in its summary.
      - run: bun test
        working-directory: apps/backend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          # Pinned rather than `latest` so CI runs the same CLI the root
          # `package.json` devDependency gives local devs, against the same
          # `supabase/config.toml`. Bump both together.
          version: 2.115.0
      - run: bun install
      # Two independent setup jobs, run at the same time because neither waits
      # on the other: bringing up Supabase is docker, and fetching the browser
      # is apt plus a download. Serially they cost the sum, ~65s; together they
      # measure 43-55s, so the browser mostly lands inside the time Supabase
      # already takes.
      #
      # Mostly, not entirely. They do contend: both are network- and disk-bound,
      # and the image pull that opens `supabase start` has been seen to stretch
      # from 20s to 29s while Chromium downloads alongside it. That is why this
      # saves ~15s rather than the ~22s the browser costs on its own.
      #
      # The cost is that neither half has its own step timing any more. If this
      # step gets slower, split it back into two `run`s to see which half moved
      # before looking anywhere else.
      #
      # ---- `supabase start` ----
      #
      # `start-local-supabase.sh` says what it starts and why, and exports
      # the stack's secret key.
      #
      # ---- `playwright install` ----
      #
      # Chromium only: the specs drive one browser, and downloading the
      # other two would triple this for nothing. `--with-deps` installs the
      # shared libraries the runner image does not carry.
      - name: Start Supabase and fetch Chromium at the same time
        run: |
          # Held back rather than interleaved with the CLI's own output, which
          # is what anyone reading this step is there for.
          log="$RUNNER_TEMP/playwright-install.log"
          (cd apps/e2e && bunx playwright install --with-deps chromium) >"$log" 2>&1 &
          playwright=$!

          # Neither failure is allowed to abort the step on the spot: with
          # `bash -e` an exiting `supabase start` would skip the `wait` below
          # and take the held-back log with it, hiding a browser that failed
          # to download behind whichever error happened to come first. Both
          # statuses are collected, the log is always flushed, and the step
          # fails afterwards if either side did.
          supabase_status=0
          bash .github/scripts/start-local-supabase.sh || supabase_status=$?

          # `wait` exits with the background job's status, so a browser that
          # failed to download fails the step here rather than surfacing as an
          # unexplained Playwright error two steps later.
          playwright_status=0
          wait "$playwright" || playwright_status=$?

          cat "$log"
          [ "$supabase_status" -eq 0 ] && [ "$playwright_status" -eq 0 ]
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
